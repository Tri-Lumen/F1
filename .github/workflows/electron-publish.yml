name: Build and publish Electron app (branch smoke build)

# Runs the 3-platform Electron build matrix as a smoke test on ordinary
# pushes to main, or on manual dispatch. Tagged releases are handled by the
# separate electron-release.yml trigger — see electron-build.yml (the
# reusable workflow both call) for why the two triggers are kept apart
# instead of combining `tags` and `paths-ignore` in one `push:` block.
on:
  push:
    branches:
      - main
    # Skip the 3-platform matrix smoke build on main pushes that don't
    # affect the Electron output (docs, Docker-only, design preview, etc.).
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'design-preview/**'
      - 'docker-compose.yml'
      - 'docker-install.sh'
      - 'Dockerfile'
      - '.github/workflows/docker-publish.yml'
      - '.github/workflows/build-bootstrapper.yml'
      - 'LICENSE'
  workflow_dispatch:

# Cancel superseded smoke builds on main — this trigger never handles tag
# pushes, so it's always safe to cancel an in-flight run here.
concurrency:
  group: electron-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/electron-build.yml
    permissions:
      contents: write
    secrets: inherit
