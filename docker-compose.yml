services:
  delta-dashboard:
    image: ghcr.io/tri-lumen/f1:latest
    container_name: delta-dashboard
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      # Hit the dedicated /api/health endpoint, not /, so a slow upstream
      # F1 API doesn't cascade into the container being marked unhealthy.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      # Required: protects the in-app self-update endpoint (/api/update) —
      # without it, anyone who can reach the mapped port can trigger a
      # git pull + npm ci + npm run build (resource exhaustion at minimum).
      # docker-install.sh auto-generates this into a .env file next to this
      # compose file on first run. Running `docker compose` directly instead?
      # Set UPDATE_SECRET yourself (e.g. `echo UPDATE_SECRET=$(openssl rand
      # -hex 32) > .env`) — compose refuses to start otherwise.
      - UPDATE_SECRET=${UPDATE_SECRET:?set UPDATE_SECRET before starting (see comment above) to secure the self-update endpoint}
    # Allow the in-app git pull to reach the host's git server
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Watchtower automatically pulls the latest image and restarts the container
  # whenever a new version is pushed to the registry. No manual rebuilds needed.
  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Pass host Docker credentials so Watchtower can pull from private registries
      # (e.g. ghcr.io). Run docker-install.sh first to populate this file.
      # ${HOME} may be unset in Portainer stacks, so fall back to /root.
      - ${HOME:-/root}/.docker/config.json:/config.json:ro
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=3600
      - WATCHTOWER_LABEL_ENABLE=false
    command: --interval 3600 delta-dashboard
